[package]
name = "soter-ta"
authors = ["jiyin004"]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Software Soter TA (A-side): local key ledger, blob codec and AIDL reply encoder"

[lib]
# rlib for the workspace and its tests, staticlib for the soter-svc daemon.
crate-type = ["rlib", "staticlib"]

[dependencies]
pif-common = { path = "../pif-common", features = ["soter-crypto"] }
rsa = { version = "0.9", features = ["sha2"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
